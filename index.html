<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="POS ไก่ทอด">

<title>POS ไก่ทอดหาดใหญ่ มูฮำหมัด</title><link id="fav" rel="icon">
<style>
:root{--bg:#f3f5f9;--c:#fff;--t:#1f2937;--m:#6b7280;--p:#ea580c;--g:#16a34a;--o:#f59e0b;--r:#dc2626;--b:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--c:#1f2937;--t:#f3f4f6;--m:#9ca3af;--b:#374151}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--t);height:100vh;height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}input{-webkit-user-select:text;user-select:text}input[type=checkbox]{min-height:0}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));background:linear-gradient(90deg,#f97316,#ea580c);color:#fff;flex-wrap:wrap;box-shadow:0 2px 8px #0003}.lg{width:46px;height:46px;border-radius:12px;border:2px solid #fff}header b{font-size:17px}
header b{margin-right:auto}header button{background:#ffffff30;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
header button.on{background:#fff;color:#c2410c;font-weight:700}
main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
.row{display:flex;gap:10px;height:100%}.l{flex:1;min-height:0;overflow:auto}.r{width:340px;background:var(--c);border-radius:12px;padding:10px;display:flex;flex-direction:column;overflow:auto}
@media(max-width:800px){.row{flex-direction:column}.r{width:100%;max-height:46%;flex:none}header button{padding:8px 10px}header b{font-size:15px}}@media(pointer:coarse){.q{width:38px;height:38px}.btn{padding:11px 14px}.chip{padding:9px 14px}header button{padding:10px 12px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}
.it{cursor:pointer;text-align:center}.it img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:6px}.th{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle;background:var(--b)}.it:active{transform:scale(.96)}.it b{display:block}.it small{color:var(--m)}
button,input,select{font:inherit;color:inherit}
.btn{border:0;background:var(--p);color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.g{background:var(--g)}.btn.o{background:var(--o)}.btn.r{background:var(--r)}.btn.x{background:var(--b);color:var(--t)}
input,select{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:8px;width:100%;font-size:16px;min-height:40px}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:99px;background:var(--c);border:1px solid var(--b);cursor:pointer}.chip.on{background:var(--p);color:#fff}
.ln{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--b)}.ln span{flex:1}
.q{width:28px;height:28px;border-radius:50%;border:1px solid var(--b);background:var(--c);cursor:pointer}
.tot{font-size:22px;font-weight:700;text-align:right;margin:8px 0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}
.s-received{background:var(--p)}.s-cooking{background:var(--o)}.s-ready{background:var(--g)}.s-served{background:#6b7280}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left}
.m{color:var(--m);font-size:13px}.gap{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#pr{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.kpi{border-radius:14px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#fb923c,#ea580c)}.kpi.d{background:linear-gradient(135deg,#475569,#1e293b)}.kpi.gg{background:linear-gradient(135deg,#22c55e,#15803d)}.kpi.rr{background:linear-gradient(135deg,#f87171,#b91c1c)}
.kpi small{opacity:.9}.kpi h2{margin:4px 0 0;font-size:26px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}.hb span{width:38%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.hb i{display:block;height:18px;border-radius:9px;background:linear-gradient(90deg,#fb923c,#ea580c)}.hb em{font-style:normal;color:var(--m);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.lgd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;font-family:monospace;width:72mm}.tk{page-break-after:always;padding:2mm}.tk h2,.tk h3{margin:2px 0;text-align:center}}

db=db||{shop:'ไก่ทอดหาดใหญ่ มูฮำหมัด อยุธยา',seq:1,autoPrint:true,stations:['ครัวร้อน','ครัวเย็น','เครื่องดื่ม'],
menu:[['ผัดกะเพราหมูสับ',60,'จานเดียว',0],['ข้าวผัดกุ้ง',80,'จานเดียว',0],['ต้มยำกุ้ง',150,'กับข้าว',0],['ส้มตำไทย',60,'กับข้าว',1],['ยำวุ้นเส้น',90,'กับข้าว',1],['ชาเย็น',35,'เครื่องดื่ม',2],['น้ำเปล่า',10,'เครื่องดื่ม',2],['โค้ก',20,'เครื่องดื่ม',2]].map((a,i)=>({id:i+1,name:a[0],price:a[1],cat:a[2],st:a[3]})),orders:[]};
let view='sell',cat='ทั้งหมด',q='',cart=[],table='',disc=0;
if(!db.shop||db.shop=='ร้านอาหาร')db.shop='ไก่ทอดหาดใหญ่ มูฮำหมัด อยุธยา';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('บันทึกไม่สำเร็จ: พื้นที่เต็ม')}};
const today=t=>new Date(t).toDateString()===new Date().toDateString();
const sub=()=>cart.reduce((a,i)=>a+i.price*i.q,0);

function render(){
 $('#sn').textContent=db.shop;$('#lg').src=LOGO;$('#fav').href=LOGO;document.title='POS '+db.shop;
 document.querySelectorAll('header [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('#app').innerHTML=({sell,kitchen,orders,menu,report,set})[view]();
}
document.querySelector('header').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}};

function sell(){
 const cats=['ทั้งหมด',...new Set(db.menu.map(m=>m.cat))];
 const list=db.menu.filter(m=>(cat=='ทั้งหมด'||m.cat==cat)&&m.name.includes(q));
 const s=sub(),tot=Math.max(0,s-disc);
 return `<div class="row"><div class="l"><input placeholder="🔍 ค้นหาเมนู" value="${esc(q)}" oninput="q=this.value;const t=document.createElement('div');t.innerHTML=sell();$('#mg').innerHTML=t.querySelector('#mg').innerHTML" style="margin-bottom:8px">
 <div class="chips">${cats.map(c=>`<span class="chip ${c==cat?'on':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</span>`).join('')}</div>
 <div class="grid" id="mg">${list.map(m=>`<div class="card it" onclick="add(${m.id})">${m.img?`<img src="${m.img}" alt="">`:''}<b>${esc(m.name)}</b><small>฿${money(m.price)}</small></div>`).join('')||'<p class="m">ไม่พบเมนู</p>'}</div></div>
 <div class="r"><input placeholder="โต๊ะ / ชื่อลูกค้า" value="${esc(table)}" oninput="table=this.value">
 <div style="flex:1;min-height:80px">${cart.map((i,x)=>`<div class="ln"><span>${esc(i.name)}<br><small class="m" onclick="note(${x})" style="cursor:pointer">${i.note?'📝 '+esc(i.note):'+ หมายเหตุ'}</small></span>
 <button class="q" onclick="qty(${x},-1)">−</button><b>${i.q}</b><button class="q" onclick="qty(${x},1)">+</button><b style="width:60px;text-align:right">${money(i.price*i.q)}</b></div>`).join('')||'<p class="m">ยังไม่มีรายการ แตะเมนูเพื่อเพิ่ม</p>'}</div>
 <div class="m">รวม ฿${money(s)} &nbsp; <a href="#" onclick="disc=+prompt('ส่วนลด (บาท)',disc)||0;render();return false">ส่วนลด: ${money(disc)}</a></div>
 <div class="tot">฿${money(tot)}</div>
 <div class="gap"><button class="btn g" style="flex:1" onclick="send(false)">ส่งเข้าครัว</button><button class="btn o" style="flex:1" onclick="send(true)">ส่งครัว + จ่ายเงิน</button><button class="btn x" onclick="cart=[];disc=0;render()">ล้าง</button></div></div></div>`;
}
function add(id){const m=db.menu.find(x=>x.id==id),l=cart.find(i=>i.id==id&&!i.note);l?l.q++:cart.push({id,name:m.name,price:m.price,q:1,note:'',st:m.st});render()}
function qty(x,d){cart[x].q+=d;if(cart[x].q<1)cart.splice(x,1);render()}
function note(x){const n=prompt('หมายเหตุ (เช่น ไม่เผ็ด)',cart[x].note);if(n!==null){cart[x].note=n;render()}}
function send(pay){
 if(!cart.length)return alert('ยังไม่มีรายการ');
 const total=Math.max(0,sub()-disc),o={id:db.seq,code:'A'+String(db.seq).padStart(4,'0'),table,items:cart.map(i=>({...i,st:i.st})),status:'received',total,disc,paid:false,method:'',t:Date.now()};
 db.seq++;db.orders.push(o);
 if(pay&&!doPay(o)){}
 save();if(db.autoPrint)printKitchen(o);
 cart=[];disc=0;table='';render();
}
function doPay(o){
 const m=prompt(`ยอดชำระ ฿${money(o.total)}\nพิมพ์ 1 = เงินสด, 2 = โอน/QR`,'1');if(!m)return false;
 if(m=='1'){const r=prompt('รับเงินมา (บาท)',o.total);if(r===null)return false;const rc=+r;if(rc<o.total){alert('เงินไม่พอ');return false}
  o.paid=true;o.method='เงินสด';o.recv=rc;alert('เงินทอน ฿'+money(rc-o.total))}
 else{o.paid=true;o.method='โอน/QR'}
 o.paidAt=Date.now();save();printReceipt(o);return true;
}
/* ===== ครัว ===== */
function kitchen(){
 const os=db.orders.filter(o=>today(o.t)&&o.status!='served');
 const col=s=>os.filter(o=>o.status==s).map(o=>card(o,true)).join('')||'<p class="m">—</p>';
 return `<div class="card" style="margin-bottom:10px"><b>✅ สแกน/พิมพ์รหัสบนใบครัวเพื่อเสิร์ฟ</b><div class="gap"><input id="cd" placeholder="เช่น A0001" style="flex:1" onkeydown="if(event.key=='Enter')serveCode()"><button class="btn g" onclick="serveCode()">เสิร์ฟแล้ว</button></div></div>
 <div class="cols">${['received','cooking','ready'].map(s=>`<div><h3><span class="tag s-${s}">${ST[s]}</span></h3>${col(s)}</div>`).join('')}</div>`;
}
function card(o,k){
 const mins=Math.floor((Date.now()-o.t)/60000);
 return `<div class="card" style="margin-bottom:8px"><b>${o.code}</b> ${o.table?'• โต๊ะ '+esc(o.table):''} <span class="tag s-${o.status}">${ST[o.status]}</span> <span class="m">${new Date(o.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} (${mins} นาที)</span>
 ${o.items.map(i=>`<div>${i.q}× ${esc(i.name)}${i.note?` <small class="m">(${esc(i.note)})</small>`:''}</div>`).join('')}
 <div class="gap">${NEXT[o.status]?`<button class="btn" onclick="adv(${o.id})">→ ${ST[NEXT[o.status]]}</button>`:''}
 ${k?`<button class="btn x" onclick="pk(${o.id})">🖨️ ใบครัว</button>`:''}</div></div>`;
}
const find=id=>db.orders.find(o=>o.id==id);
function adv(id){const o=find(id);o.status=NEXT[o.status];save();render()}
function pk(id){printKitchen(find(id))}
function serveCode(){const c=$('#cd').value.trim().toUpperCase(),o=db.orders.find(x=>x.code==c);
 if(!o)return alert('ไม่พบออเดอร์ '+c);if(o.status=='served')return alert('ออเดอร์นี้เสิร์ฟแล้ว');o.status='served';save();render();}
/* ===== ออเดอร์ ===== */
function orders(){
 const os=db.orders.filter(o=>today(o.t)).reverse();
 return `<h3>ออเดอร์วันนี้ (${os.length})</h3>`+(os.map(o=>`<div class="card" style="margin-bottom:8px">
 <b>${o.code}</b> ${o.table?'• โต๊ะ '+esc(o.table):''} <span class="tag s-${o.status}">${ST[o.status]}</span> ${o.paid?`<span class="tag s-ready">จ่ายแล้ว (${o.method})</span>`:'<span class="tag" style="background:var(--r)">ค้างชำระ</span>'}
 <div class="m">${o.items.map(i=>i.q+'× '+esc(i.name)).join(', ')}</div><b>฿${money(o.total)}</b>
 <div class="gap">${o.paid?'':`<button class="btn g" onclick="pay(${o.id})">💰 ชำระเงิน</button>`}
 ${NEXT[o.status]?`<button class="btn" onclick="adv(${o.id})">→ ${ST[NEXT[o.status]]}</button>`:''}
 <button class="btn x" onclick="pk(${o.id})">🖨️ ใบครัว</button>${o.paid?`<button class="btn x" onclick="printReceipt(find(${o.id}))">🧾 ใบเสร็จ</button>`:''}
 <button class="btn r" onclick="del(${o.id})">ยกเลิก</button></div></div>`).join('')||'<p class="m">ยังไม่มีออเดอร์</p>');
}
function pay(id){doPay(find(id));render()}
function del(id){if(confirm('ยกเลิกออเดอร์นี้?')){db.orders=db.orders.filter(o=>o.id!=id);save();render()}}
/* ===== เมนู ===== */
function menu(){
 return `<div class="gap" style="margin-bottom:8px"><button class="btn g" onclick="editM()">+ เพิ่มเมนู</button></div><div class="card"><table><tr><th>รูป</th><th>เมนู</th><th>ราคา</th><th>หมวด</th><th>สถานี</th><th></th></tr>
 ${db.menu.map(m=>`<tr><td>${m.img?`<img class="th" src="${m.img}" alt="">`:'<div class="th"></div>'}</td><td>${esc(m.name)}</td><td>${money(m.price)}</td><td>${esc(m.cat)}</td><td>${esc(db.stations[m.st]||'-')}</td><td><button class="btn o" onclick="pickImg(${m.id})">📷 ${m.img?'เปลี่ยนรูป':'ใส่รูป'}</button> ${m.img?`<button class="btn x" onclick="delImg(${m.id})">ลบรูป</button> `:''}<button class="btn x" onclick="editM(${m.id})">แก้</button> <button class="btn r" onclick="delM(${m.id})">ลบ</button></td></tr>`).join('')}</table></div>`;
}
function pickImg(id){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];i.remove();if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
   const s=360,c=document.createElement('canvas'),side=Math.min(im.width,im.height);c.width=c.height=s;
   c.getContext('2d').drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,s,s);
   db.menu.find(m=>m.id==id).img=c.toDataURL('image/jpeg',.75);save();render()};
   im.onerror=()=>alert('เปิดรูปไม่ได้');im.src=r.result};
  r.readAsDataURL(f)};
 i.style.display='none';document.body.appendChild(i);i.click();
}
function delImg(id){delete db.menu.find(m=>m.id==id).img;save();render()}
function editM(id){
 const m=db.menu.find(x=>x.id==id)||{name:'',price:0,cat:'ทั่วไป',st:0};
 const n=prompt('ชื่อเมนู',m.name);if(!n)return;const p=+prompt('ราคา',m.price);if(isNaN(p))return;
 const c=prompt('หมวดหมู่',m.cat)||'ทั่วไป';
 const s=+prompt('สถานีพิมพ์ (หมายเลข)\n'+db.stations.map((x,i)=>i+' = '+x).join('\n'),m.st)||0;
 if(id){Object.assign(m,{name:n,price:p,cat:c,st:s})}else db.menu.push({id:Date.now(),name:n,price:p,cat:c,st:s});
 save();render();
}
function delM(id){if(confirm('ลบเมนูนี้?')){db.menu=db.menu.filter(m=>m.id!=id);save();render()}}
/* ===== รายงาน ===== */
let rp='today';
function barSvg(l,v){const W=640,H=220,p=28,mx=Math.max(...v,1),bw=(W-p*2)/v.length;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs>`
 +[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${H-p-(H-p*2)*f}" y2="${H-p-(H-p*2)*f}" stroke="var(--b)"/>`).join('')
 +v.map((x,i)=>{const h=(H-p*2)*x/mx;return `<rect x="${p+i*bw+bw*.15}" y="${H-p-h}" width="${bw*.7}" height="${Math.max(h,0)}" rx="3" fill="url(#gr)"><title>${l[i]}: ฿${money(x)}</title></rect>`+(v.length<=17||i%5==0?`<text x="${p+i*bw+bw/2}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--m)">${l[i]}</text>`:'')}).join('')
 +`<text x="${p}" y="14" font-size="11" fill="var(--m)">สูงสุด ฿${money(mx)}</text></svg>`}
function donut(parts,n){const T=parts.reduce((a,x)=>a+x[1],0)||1,C=2*Math.PI*40;let off=0;
 return `<svg viewBox="0 0 120 120" width="150"><circle cx="60" cy="60" r="40" fill="none" stroke="var(--b)" stroke-width="18"/>`
 +parts.map(([_,v,c])=>{const len=C*v/T,e=`<circle cx="60" cy="60" r="40" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return e}).join('')
 +`<text x="60" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="var(--t)">${n}</text><text x="60" y="74" text-anchor="middle" font-size="10" fill="var(--m)">บิล</text></svg>`}
function report(){
 const n0=new Date(),d0=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate()).getTime(),days=rp=='today'?1:+rp,from=d0-(days-1)*864e5;
 const os=db.orders.filter(o=>o.paid&&o.t>=from),sum=a=>a.reduce((x,o)=>x+o.total,0),tot=sum(os),n=os.length;
 const labels=[],vals=[];
 if(days==1){for(let h=6;h<=22;h++){labels.push(h+'น.');vals.push(0)}os.forEach(o=>{const h=Math.min(Math.max(new Date(o.t).getHours(),6),22);vals[h-6]+=o.total})}
 else{for(let i=0;i<days;i++){const d=new Date(from+i*864e5);labels.push(d.getDate()+'/'+(d.getMonth()+1));vals.push(0)}os.forEach(o=>{const i=Math.floor((o.t-from)/864e5);if(i>=0&&i<days)vals[i]+=o.total})}
 const cnt={};let items=0;os.forEach(o=>o.items.forEach(i=>{cnt[i.name]=(cnt[i.name]||0)+i.q;items+=i.q}));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=top.length?top[0][1]:1;
 const cash=os.filter(o=>o.method=='เงินสด'),tf=os.filter(o=>o.method!='เงินสด');
 const unpaid=sum(db.orders.filter(o=>!o.paid&&o.t>=from));
 const best=vals.indexOf(Math.max(...vals));
 return `<div class="chips">${[['today','วันนี้'],['7','7 วัน'],['30','30 วัน']].map(([k,t])=>`<span class="chip ${rp==k?'on':''}" onclick="rp='${k}';render()">${t}</span>`).join('')}</div>
 <div class="kpis"><div class="kpi"><small>💰 ยอดขายรวม</small><h2>฿${money(tot)}</h2></div>
 <div class="kpi d"><small>🧾 จำนวนบิล</small><h2>${n}</h2></div>
 <div class="kpi gg"><small>📈 เฉลี่ยต่อบิล</small><h2>฿${money(n?Math.round(tot/n):0)}</h2></div>
 <div class="kpi d"><small>🍗 จำนวนที่ขายได้</small><h2>${items}</h2></div>
 <div class="kpi rr"><small>⏳ ค้างชำระ</small><h2>฿${money(unpaid)}</h2></div></div>
 <div class="card"><b>${days==1?'📊 ยอดขายรายชั่วโมง (วันนี้)':'📊 ยอดขายรายวัน ('+days+' วันล่าสุด)'}</b>${tot?barSvg(labels,vals):'<p class="m">ยังไม่มีข้อมูลการขาย</p>'}
 ${tot?`<div class="m">${days==1?'ช่วงขายดีที่สุด':'วันที่ขายดีที่สุด'}: ${labels[best]} (฿${money(vals[best])})</div>`:''}</div>
 <div class="two"><div class="card"><b>💳 ช่องทางชำระเงิน</b><div class="lgd" style="margin-top:8px">${donut([['เงินสด',sum(cash),'#ea580c'],['โอน/QR',sum(tf),'#0ea5e9']],n)}
 <div><div><span class="dot" style="background:#ea580c"></span>เงินสด ฿${money(sum(cash))} (${cash.length})</div><div style="margin-top:6px"><span class="dot" style="background:#0ea5e9"></span>โอน/QR ฿${money(sum(tf))} (${tf.length})</div></div></div></div>
 <div class="card"><b>🏆 เมนูขายดี</b>${top.map(([nm,c])=>`<div class="hb"><span>${esc(nm)}</span><div style="flex:1"><i style="width:${Math.max(c/mx*100,4)}%"></i></div><em>${c}</em></div>`).join('')||'<p class="m">ยังไม่มีข้อมูล</p>'}</div></div>
 <div class="gap"><button class="btn x" onclick="window.print()">🖨️ พิมพ์รายงาน</button></div>`;
}
/* ===== ตั้งค่า ===== */
function set(){
 return `<div class="card"><label>ชื่อร้าน</label><input value="${esc(db.shop)}" onchange="db.shop=this.value;save();render()">
 <label><br>ชื่อสถานีครัว/เครื่องพิมพ์ (คั่นด้วยจุลภาค)</label><input value="${esc(db.stations.join(','))}" onchange="db.stations=this.value.split(',').map(s=>s.trim()).filter(Boolean);save()">
 <p><label><input type="checkbox" style="width:auto" ${db.autoPrint?'checked':''} onchange="db.autoPrint=this.checked;save()"> พิมพ์ใบครัวอัตโนมัติเมื่อส่งออเดอร์</label></p>
 <div class="gap"><button class="btn" onclick="backup()">⬇️ สำรองข้อมูล (JSON)</button><label class="btn o">⬆️ กู้คืนข้อมูล<input type="file" hidden onchange="restore(this.files[0])"></label>
 <button class="btn x" onclick="if(confirm('ล้างออเดอร์ทั้งหมด?')){db.orders=[];db.seq=1;save();render()}">ล้างออเดอร์</button></div>
 <p class="m">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ควรสำรองข้อมูลเป็นประจำ (เช่น ปิดร้านทุกวัน) เพื่อซิงก์ขึ้น Cloud/เครื่องอื่นได้ภายหลัง</p></div>`;
}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='pos-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;f.text().then(t=>{try{db=JSON.parse(t);save();render();alert('กู้คืนสำเร็จ')}catch(e){alert('ไฟล์ไม่ถูกต้อง')}})}
/* ===== พิมพ์ ===== */
function doPrint(h){$('#pr').innerHTML=h;window.print()}
function printKitchen(o){
 const by={};o.items.forEach(i=>(by[i.st]=by[i.st]||[]).push(i));
 doPrint(Object.entries(by).map(([s,it])=>`<div class="tk"><h2>${esc(db.stations[s]||'ครัว')}</h2><h2 style="font-size:28px">${o.code}</h2><h3>${o.table?'โต๊ะ '+esc(o.table):''} ${new Date(o.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</h3><hr>
 ${it.map(i=>`<div style="font-size:18px"><b>${i.q}×</b> ${esc(i.name)}${i.note?`<br>&nbsp;&nbsp;** ${esc(i.note)}`:''}</div>`).join('')}<hr><div style="text-align:center">รหัสเสิร์ฟ: ${o.code}</div></div>`).join(''));
}
function printReceipt(o){
 doPrint(`<div class="tk"><div style="text-align:center"><img src="${LOGO}" style="width:26mm"></div><h2>${esc(db.shop)}</h2><div style="text-align:center">${new Date(o.paidAt||o.t).toLocaleString('th-TH')}<br>${o.code} ${o.table?'โต๊ะ '+esc(o.table):''}</div><hr>
 ${o.items.map(i=>`<div style="display:flex;justify-content:space-between"><span>${i.q}× ${esc(i.name)}</span><span>${money(i.q*i.price)}</span></div>`).join('')}<hr>
 ${o.disc?`<div>ส่วนลด -${money(o.disc)}</div>`:''}<h3 style="text-align:right">รวม ฿${money(o.total)}</h3><div>ชำระ: ${o.method}${o.recv?` รับ ${money(o.recv)} ทอน ${money(o.recv-o.total)}`:''}</div><p style="text-align:center">ขอบคุณที่ใช้บริการ</p></div>`);
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();setInterval(()=>{if(view=='kitchen'&&!document.activeElement.matches('input'))render()},30000);
</script></body></html>
